<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Fridge AI</title>
</head>

<body>

<h1>Поиск продуктов для блюда</h1>

<form id="searchForm">

    <div>
        <label for="userName">Имя пользователя:</label>
        <input
                type="text"
                id="userName"
                name="userName"
        >
    </div>

    <br>

    <div>
        <label for="dishTitle">Название блюда:</label>
        <input
                type="text"
                id="dishTitle"
                name="dishTitle"
        >
    </div>

    <br>

    <button type="submit">Искать</button>

</form>

<br>

<h2>Результат:</h2>

<output id="result"></output>

<dialog id="errorModal">
    <p id="errorMessage"></p>
    <button type="button" id="closeModal">OK</button>
</dialog>

<script type="module" src="./main.js"></script>

</body>
</html>
